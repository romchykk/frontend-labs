<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №3 — Меню</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #222;
        }
        p {
            font-size: 15px;
            color: #666;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            text-decoration: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #3b82f6;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
        }
        .btn.secondary {
            background-color: #10b981;
        }
        .btn.secondary:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Лабораторна робота №3</h1>
        <p>Блочна верстка макету сайту (Варіант 7)</p>
        <div class="buttons">
            <a href="task1.html" class="btn">Завдання 1: Верстка на Float</a>
            <a href="task2.html" class="btn secondary">Завдання 2: Верстка на Flexbox</a>
        </div>
    </div>
</body>
</html>
